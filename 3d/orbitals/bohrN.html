<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nitrogen — Bohr Model</title>
<style>
  :root {
    --bg:        #060912;
    --bg-deep:   #02040A;
    --accent:    #6FE7FF;
    --proton:    #FF5066;
    --neutron:   #5CD97A;
    --electron:  #5099FF;
    --text:      #E6F4FF;
    --muted:     rgba(230, 244, 255, 0.55);
    --line:      rgba(111, 231, 255, 0.18);
    --card:      rgba(8, 14, 28, 0.78);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               overflow: hidden; font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
               -webkit-tap-highlight-color: transparent; }

  /* Fullscreen WebGL stage. */
  canvas#stage { display: block; width: 100vw; height: 100vh;
                 background:
                   radial-gradient(ellipse 60% 40% at 50% 45%, rgba(111,231,255,0.08), transparent 70%),
                   linear-gradient(180deg, #060912 0%, #02040A 100%);
                 cursor: grab; }
  canvas#stage:active { cursor: grabbing; }

  /* Info panel — periodic-table-card aesthetic. */
  .info { position: fixed; top: 18px; left: 18px; z-index: 5;
          background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 16px 18px; min-width: 240px; max-width: 280px;
          backdrop-filter: blur(10px) saturate(140%);
          -webkit-backdrop-filter: blur(10px) saturate(140%);
          box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45),
                      0 0 24px rgba(111, 231, 255, 0.06),
                      inset 0 1px 0 rgba(255, 255, 255, 0.05);
          animation: fadeIn 0.6s ease both; }
  .info h1 { margin: 0 0 2px; font-size: 11px; letter-spacing: 2.4px;
             text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .info .symbol-row { display: flex; align-items: baseline; gap: 12px; margin: 4px 0 8px; }
  .info .symbol { font-size: 56px; font-weight: 700; line-height: 1;
                  color: var(--text); letter-spacing: -1px;
                  text-shadow: 0 0 28px rgba(111, 231, 255, 0.25); }
  .info .name { font-size: 16px; color: var(--text); font-weight: 500; opacity: 0.85; }
  .info .meta { font-size: 11px; color: var(--muted); letter-spacing: 1.4px; }
  .info hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  .info .config { font-size: 12px; color: var(--text); margin-bottom: 4px; }
  .info .config sup { font-size: 9px; vertical-align: super; }
  .info .shells { font-size: 11px; color: var(--muted); line-height: 1.65; }
  .info .shells b { color: var(--accent); font-weight: 600; }
  .legend { font-size: 11px; color: var(--muted); line-height: 1.7; }
  .legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                 margin-right: 8px; vertical-align: middle;
                 box-shadow: 0 0 8px currentColor; }
  .legend .dot.proton   { background: var(--proton);   color: var(--proton); }
  .legend .dot.neutron  { background: var(--neutron);  color: var(--neutron); }
  .legend .dot.electron { background: var(--electron); color: var(--electron); }

  /* Bottom-right hint — fades after first interaction. */
  .hint { position: fixed; bottom: 16px; right: 18px; z-index: 5;
          font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase;
          color: var(--muted); opacity: 0.85; pointer-events: none;
          animation: fadeIn 0.8s 0.3s ease both;
          transition: opacity 0.5s ease; }
  .hint.dim { opacity: 0; }

  /* Error overlay (CDN failure / no THREE / WebGL refused). */
  #err { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100;
         max-width: 560px; background: rgba(60, 20, 30, 0.95);
         border: 1px solid #ff5577; color: #ffbbcc; padding: 20px; border-radius: 8px;
         font: 13px/1.55 ui-monospace, monospace; white-space: pre-wrap; display: none; }
  #err.visible { display: block; }
  #err h2 { margin: 0 0 8px; color: #ff5577; font-size: 14px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); }
                       to   { opacity: 1; transform: translateY(0);    } }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<aside class="info">
  <h1>Bohr Model</h1>
  <div class="symbol-row">
    <div class="symbol">N</div>
    <div>
      <div class="name">Nitrogen</div>
      <div class="meta">Z = 7 &middot; A = 14</div>
    </div>
  </div>
  <hr>
  <div class="config">1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>3</sup></div>
  <div class="shells"><b>K</b> shell (n=1): 2 e<sup>&minus;</sup><br>
                      <b>L</b> shell (n=2): 5 e<sup>&minus;</sup></div>
  <hr>
  <div class="legend">
    <span class="dot proton"></span>Proton &nbsp; (&times; 7)<br>
    <span class="dot neutron"></span>Neutron (&times; 7)<br>
    <span class="dot electron"></span>Electron (&times; 7)
  </div>
</aside>

<div class="hint" id="hint">drag to rotate &middot; auto-rotates when idle</div>

<div id="err"><h2>Error</h2><div id="err-msg"></div></div>

<script>
  const errEl  = document.getElementById('err');
  const errMsg = document.getElementById('err-msg');
  function showError(title, msg) {
    errEl.querySelector('h2').textContent = title;
    errMsg.textContent = msg;
    errEl.classList.add('visible');
  }
  window.addEventListener('error', function (e) {
    showError('JavaScript Error', String(e.message || e) + '\n' + ((e.error && e.error.stack) || ''));
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"
        onerror="showError('CDN load failed','three.min.js could not be fetched. Open with internet on first run.')"></script>

<script>
if (!window.THREE) {
  showError('THREE not available',
    'window.THREE is undefined after the CDN script tag — likely no internet on first open.');
} else {
(function () {
  'use strict';
  const THREE = window.THREE;

  // ───────────────────────────────────────────────────────────────────
  // Bohr model — Nitrogen (Z=7, A=14)
  //
  // Postulates implemented:
  //   1. Discrete circular orbits at radii r_n ∝ n²       (compressed for view)
  //   2. Electrons fill from inner shell outward — K=2, L=5
  //   3. Orbital period T_n ∝ n³  →  angular speed ω_n ∝ 1/n³
  //      (using 1/n^1.6 here so the outer shell is still visibly moving)
  //   4. Nucleus = positively-charged dense cluster of nucleons (p+ + n)
  //
  // Quality polish:
  //   - Each atom has a "core" sphere + a larger additive-blended halo
  //   - Smooth drag-to-rotate camera with momentum decay
  //   - Auto-orbit when idle (gentle Y-axis spin)
  //   - Subtle nucleus pulse + per-nucleon Brownian jitter
  //   - Trail rings on the orbits with cyan tint matching the project palette
  // ───────────────────────────────────────────────────────────────────

  // ─── Scene setup ───
  const canvas = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({
    canvas: canvas, antialias: true, alpha: true,
    powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);   // transparent — let the CSS gradient show

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);

  // ─── Materials (one set, reused) ───
  // Cores are nearly opaque; halos are large transparent additive spheres
  // that "leak" colour around the cores → reads as glow without bloom.
  const COL_PROTON   = new THREE.Color(0xFF5066);
  const COL_NEUTRON  = new THREE.Color(0x5CD97A);
  const COL_ELECTRON = new THREE.Color(0x5099FF);
  const COL_RING     = new THREE.Color(0x6FE7FF);

  function coreMaterial(color) {
    return new THREE.MeshBasicMaterial({
      color: color, transparent: true, opacity: 0.96
    });
  }
  function haloMaterial(color, opacity) {
    return new THREE.MeshBasicMaterial({
      color: color, transparent: true, opacity: opacity || 0.32,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
    });
  }

  const matProtonCore    = coreMaterial(COL_PROTON);
  const matProtonHalo    = haloMaterial(COL_PROTON,   0.30);
  const matNeutronCore   = coreMaterial(COL_NEUTRON);
  const matNeutronHalo   = haloMaterial(COL_NEUTRON,  0.28);
  const matElectronCore  = coreMaterial(COL_ELECTRON);
  const matElectronHalo  = haloMaterial(COL_ELECTRON, 0.36);
  const matElectronTrail = haloMaterial(COL_ELECTRON, 0.18);
  const matRing          = haloMaterial(COL_RING,     0.40);

  const ownedMats = [
    matProtonCore, matProtonHalo, matNeutronCore, matNeutronHalo,
    matElectronCore, matElectronHalo, matElectronTrail, matRing
  ];

  // ─── Shared geometries (allocate once) ───
  const NUCLEON_R  = 0.18;
  const ELECTRON_R = 0.16;
  const geoNucleonCore = new THREE.SphereGeometry(NUCLEON_R,           18, 14);
  const geoNucleonHalo = new THREE.SphereGeometry(NUCLEON_R * 1.55,    16, 12);
  const geoElectronCore = new THREE.SphereGeometry(ELECTRON_R,         18, 14);
  const geoElectronHalo = new THREE.SphereGeometry(ELECTRON_R * 1.7,   16, 12);
  const geoElectronTrail = new THREE.SphereGeometry(ELECTRON_R * 2.4,  16, 12);

  const ownedGeos = [
    geoNucleonCore, geoNucleonHalo,
    geoElectronCore, geoElectronHalo, geoElectronTrail
  ];

  // ─── Build nitrogen ───
  const root = new THREE.Group();
  scene.add(root);

  // Fibonacci-sphere packing of 14 nucleons (7p + 7n).
  function fibSphere(N, radius) {
    const out = new Array(N);
    const offset = 2 / N;
    const inc = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) {
      const y = ((i * offset) - 1) + (offset / 2);
      const r = Math.sqrt(1 - y * y);
      const phi = i * inc;
      out[i] = new THREE.Vector3(
        Math.cos(phi) * r * radius,
        y * radius,
        Math.sin(phi) * r * radius
      );
    }
    return out;
  }

  // ─ Nucleus ─
  const nucleus = new THREE.Group();
  root.add(nucleus);

  const Z = 7;                   // protons
  const N_COUNT = 7;             // neutrons (¹⁴N)
  const NUCLEON_PACK_R = 0.36;   // overall cluster radius
  const nucleonRest = fibSphere(Z + N_COUNT, NUCLEON_PACK_R);
  const nucleonRecords = [];     // for animation jitter

  for (let i = 0; i < Z + N_COUNT; i++) {
    const isProton = i < Z;
    const wrap = new THREE.Group();
    wrap.position.copy(nucleonRest[i]);

    const halo = new THREE.Mesh(geoNucleonHalo, isProton ? matProtonHalo : matNeutronHalo);
    const core = new THREE.Mesh(geoNucleonCore, isProton ? matProtonCore : matNeutronCore);
    wrap.add(halo);
    wrap.add(core);
    nucleus.add(wrap);

    nucleonRecords.push({
      group: wrap,
      base: nucleonRest[i].clone(),
      jitterPhase: Math.random() * Math.PI * 2,
      jitterSpeed: 1.2 + Math.random() * 0.8,
      jitterAmp: 0.018 + Math.random() * 0.012
    });
  }

  // ─ Shells ─
  // Bohr radii scale as n²; we compress slightly so both fit nicely on screen.
  // Real ratio (r_2/r_1 = 4) preserved to one significant figure.
  const SHELL_K_R = 1.55;
  const SHELL_L_R = 3.65;        // ratio ≈ 2.35 (compressed from 4)

  // Bohr orbital periods scale as n³, so ω ∝ 1/n³. Strict 1:1/8 makes the L
  // shell almost immobile; we soften to 1/n^1.6 so it still reads as motion.
  const OMEGA_K = 1.20;          // rad/s
  const OMEGA_L = OMEGA_K / Math.pow(2, 1.6);   // ≈ 0.397 rad/s

  // Orbits sit on different planes for 3D depth — both planes go through
  // the origin (concentric). Slight off-axis tilts so adjacent shells don't
  // visually merge from the side.
  const SHELL_K_AXIS = new THREE.Vector3(0.00, 1.00, 0.10).normalize();
  const SHELL_L_AXIS = new THREE.Vector3(0.18, 1.00, -0.12).normalize();

  const shells = [];

  function buildShell(name, n, radius, electronCount, omega, axis) {
    const sg = new THREE.Group();

    // Orient the shell so its orbit plane normal = axis.
    const q = new THREE.Quaternion();
    q.setFromUnitVectors(new THREE.Vector3(0, 1, 0), axis);
    sg.quaternion.copy(q);

    // Ring (the orbit visualisation).
    const ringGeo = new THREE.TorusGeometry(radius, 0.025 + n * 0.004, 10, Math.max(80, electronCount * 16));
    ownedGeos.push(ringGeo);
    const ring = new THREE.Mesh(ringGeo, matRing);
    ring.rotation.x = Math.PI / 2;     // ring lies in the xz plane (= orbit plane after q)
    sg.add(ring);

    // Electrons evenly spaced on the ring.
    const electrons = new Array(electronCount);
    for (let k = 0; k < electronCount; k++) {
      const angle = (k / electronCount) * Math.PI * 2;
      const wrap = new THREE.Group();
      wrap.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);

      const trail = new THREE.Mesh(geoElectronTrail, matElectronTrail);
      const halo  = new THREE.Mesh(geoElectronHalo,  matElectronHalo);
      const core  = new THREE.Mesh(geoElectronCore,  matElectronCore);
      wrap.add(trail);
      wrap.add(halo);
      wrap.add(core);

      sg.add(wrap);
      electrons[k] = { wrap: wrap, angle: angle };
    }

    root.add(sg);
    shells.push({ name, n, radius, electronCount, omega, group: sg, electrons });
  }

  buildShell('K', 1, SHELL_K_R, 2, OMEGA_K, SHELL_K_AXIS);
  buildShell('L', 2, SHELL_L_R, 5, OMEGA_L, SHELL_L_AXIS);

  // ─── Camera control: drag-to-rotate + idle auto-orbit + momentum ───
  const CAM_DIST = 8.5;
  let theta = -0.5;                                    // azimuth (around Y)
  let phi   = Math.PI * 0.42;                          // polar (from Y axis)
  let velTheta = 0, velPhi = 0;
  let isDragging = false;
  let prevX = 0, prevY = 0;
  let lastInteraction = -Infinity;

  function dimHint() {
    const h = document.getElementById('hint');
    if (h) h.classList.add('dim');
  }

  canvas.addEventListener('pointerdown', function (e) {
    isDragging = true;
    prevX = e.clientX; prevY = e.clientY;
    velTheta = 0; velPhi = 0;
    lastInteraction = performance.now();
    dimHint();
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!isDragging) return;
    const dx = e.clientX - prevX;
    const dy = e.clientY - prevY;
    const dampedX = -dx * 0.0085;
    const dampedY = -dy * 0.0085;
    theta += dampedX;
    phi   = Math.max(0.18, Math.min(Math.PI - 0.18, phi + dampedY));
    velTheta = dampedX;
    velPhi   = dampedY;
    prevX = e.clientX; prevY = e.clientY;
    lastInteraction = performance.now();
  });
  function endDrag() { isDragging = false; }
  canvas.addEventListener('pointerup',     endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave',  endDrag);

  function updateCamera(dt, now) {
    if (!isDragging) {
      // Apply remaining momentum, decay it.
      theta += velTheta;
      phi    = Math.max(0.18, Math.min(Math.PI - 0.18, phi + velPhi));
      const decay = Math.pow(0.9, dt * 60);
      velTheta *= decay;
      velPhi   *= decay;
      // Auto-orbit kicks in after 1.5s of inactivity AND when momentum has died down.
      const idle = (now - lastInteraction) > 1500;
      if (idle && Math.abs(velTheta) < 0.0008 && Math.abs(velPhi) < 0.0008) {
        theta += 0.06 * dt;        // gentle clockwise drift
      }
    }
    const sp = Math.sin(phi), cp = Math.cos(phi);
    camera.position.set(
      CAM_DIST * sp * Math.cos(theta),
      CAM_DIST * cp,
      CAM_DIST * sp * Math.sin(theta)
    );
    camera.lookAt(0, 0, 0);
  }

  // ─── Resize ───
  window.addEventListener('resize', function () {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });

  // ─── Animation loop ───
  let last = performance.now();
  let pulseT = 0;

  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    pulseT += dt;

    // Nucleus pulse (the "breathing").
    const pulse = 1 + Math.sin(pulseT * 1.8) * 0.035;
    nucleus.scale.setScalar(pulse);

    // Per-nucleon Brownian jitter — small displacement in random local
    // directions to suggest thermal motion.
    for (let i = 0; i < nucleonRecords.length; i++) {
      const r = nucleonRecords[i];
      const ph = pulseT * r.jitterSpeed + r.jitterPhase;
      r.group.position.set(
        r.base.x + Math.sin(ph * 1.3) * r.jitterAmp,
        r.base.y + Math.sin(ph * 0.9 + 1.7) * r.jitterAmp,
        r.base.z + Math.sin(ph * 1.1 + 3.1) * r.jitterAmp
      );
    }

    // Whole-nucleus slow tumble (around its own center) for 3D feedback.
    nucleus.rotation.y += 0.18 * dt;
    nucleus.rotation.x += 0.07 * dt;

    // Advance electrons on each shell.
    for (let i = 0; i < shells.length; i++) {
      const sh = shells[i];
      const da = sh.omega * dt;
      for (let k = 0; k < sh.electrons.length; k++) {
        const e = sh.electrons[k];
        e.angle += da;
        e.wrap.position.set(
          Math.cos(e.angle) * sh.radius,
          0,
          Math.sin(e.angle) * sh.radius
        );
      }
    }

    // Whole-atom Y drift (very subtle).
    root.position.y = Math.sin(pulseT * 0.4) * 0.05;

    updateCamera(dt, now);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ─── Cleanup on unload (good citizen — frees GPU resources). ───
  window.addEventListener('beforeunload', function () {
    for (let i = 0; i < ownedGeos.length; i++) {
      try { ownedGeos[i].dispose(); } catch (_e) {}
    }
    for (let i = 0; i < ownedMats.length; i++) {
      try { ownedMats[i].dispose(); } catch (_e) {}
    }
    try { renderer.dispose(); } catch (_e) {}
  });

  // Console-side debug surface.
  window.bohrN = {
    scene, camera, renderer, root, nucleus, shells,
    proton: Z, neutron: N_COUNT, electron: shells.reduce((a, s) => a + s.electronCount, 0)
  };
})();
}
</script>

</body>
</html>
